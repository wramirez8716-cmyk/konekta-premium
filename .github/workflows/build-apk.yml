name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Configure Git
        run: |
          git config --global user.email "wilmer@example.com"
          git config --global user.name "Wilmer"

      - name: Check Expo account
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: eas whoami

      - name: Build APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # AQUÍ ESTÁ LA CLAVE: --clear-cache fuerza a usar el nuevo app.json
        run: eas build --platform android --profile preview --non-interactive --clear-cache
